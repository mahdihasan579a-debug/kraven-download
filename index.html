<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAVEN - App Download Center</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b10;color:#fff;font-family:Arial,sans-serif}
.container{padding:40px 24px;max-width:430px;margin:0 auto}
.logo{text-align:center;font-size:36px;font-weight:bold;margin-bottom:18px}
.subtitle{text-align:center;color:#9da3b0;font-size:17px;margin-bottom:35px}
.card{background:#111018;border:1px solid #29313b;border-radius:24px;padding:22px;margin-bottom:18px}
.app-title{font-size:22px;font-weight:bold}
.app-info{color:#9da3b0;font-size:15px;margin-top:12px}
.download{display:block;width:100%;margin-top:22px;padding:17px;border-radius:17px;background:#32d17c;color:#07100b;text-align:center;text-decoration:none;font-size:18px;font-weight:bold}
.download:active{transform:scale(.98)}
.note{text-align:center;color:#777d87;margin-top:35px;font-size:14px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">KRAVEN</div>
  <div class="subtitle">App Download Center</div>

  <div class="card">
    <div class="app-title">APP DOWNLOAD 1</div>
    <div class="app-info">APK • Download Link 1</div>
    <a id="downloadButton1" class="download" href="#" target="_blank">DOWNLOAD</a>
  </div>

  <div class="card">
    <div class="app-title">APP DOWNLOAD 2</div>
    <div class="app-info">APK • Download Link 2</div>
    <a id="downloadButton2" class="download" href="#" target="_blank">DOWNLOAD</a>
  </div>

  <div class="note">MOD BY KRAVEN</div>
</div>

<script>
// ILAGAY DITO ANG DIRECT DOWNLOAD LINKS NG APK
const downloadLink1 = "https://example.com/download1.apk";
const downloadLink2 = "https://example.com/download2.apk";

function startDownload(url, button) {
    if (!url || url.includes("example.com")) {
        alert("Ilagay muna ang actual APK download link sa index.html.");
        return;
    }

    button.textContent = "DOWNLOADING...";
    button.style.pointerEvents = "none";

    const a = document.createElement("a");
    a.href = url;
    a.download = "";
    a.target = "_blank";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => {
        button.textContent = "DOWNLOAD STARTED";
        button.style.background = "#25b96b";

        setTimeout(() => {
            button.textContent = "OPEN DOWNLOADS / INSTALL APK";
            button.style.pointerEvents = "auto";
            button.onclick = () => {
                window.open(url, "_blank");
            };
        }, 2500);
    }, 800);
}

document.getElementById("downloadButton1").onclick = function(e) {
    e.preventDefault();
    startDownload(https://www.mediafire.com/file/miivrm61kmk08q3/NBA2K27+TRIO+COLLAB+BY+SWE_sign_sign_sign_sign_sign.apk/file?fbclid=IwZXh0bgNhZW0CMTEAc3J0YwZhcHBfaWQPMjc1MjU0NjkyNTk4Mjc5AAEee0auU0wGv1DEL3-OonQ9dgYzDw-MaHpOlzNnYjzcEcpvreWPZNk_4h-N_IU_aem_asocCk-WaHcm_m3A6oCf1g&dkey=miivrm61kmk08q3, this);
};

document.getElementById("downloadButton2").onclick = function(e) {
    e.preventDefault();
    startDownload(downloadLink2, this);
};
</script>
</body>
</html>
